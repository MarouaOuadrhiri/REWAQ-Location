<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>REWAQ — Navbar proposals</title><style>*{box-sizing:border-box}body{margin:0;background:#eeeae1;color:#103e38;font-family:Arial,sans-serif}main{padding:25px 35px;max-width:1400px;margin:auto}h1{font-size:22px;font-weight:500;letter-spacing:-.035em;margin:0 0 8px}.intro{font-size:11px;color:#748078;margin:0 0 26px}.proposal{margin-bottom:27px}.heading{display:flex;justify-content:space-between;align-items:center;padding:0 0 13px}.heading strong{font-size:13px;font-weight:600}.heading span{font-size:10px;color:#748078}.screen{border-radius:18px;background:#faf7f1;overflow:hidden;border:1px solid #deddd2;box-shadow:0 7px 25px #103e3805}.navbar{display:flex;align-items:center;justify-content:space-between;gap:20px;height:86px;padding:0 36px}.logo{width:158px;height:48px;object-fit:contain;flex-shrink:0}.links{display:flex;gap:25px;align-items:center;font-size:11px}.links a{white-space:nowrap;position:relative;color:inherit;text-decoration:none}.active{font-weight:600}.active:after{content:'';position:absolute;bottom:-12px;left:0;right:0;height:2px;background:#c86a4a}.menu{display:none}.actions{display:flex;gap:17px;align-items:center;font-size:10px}.book{display:flex;gap:20px;align-items:center;background:#103e38;color:#faf7f1;text-decoration:none;padding:13px 18px;border-radius:28px;font-size:11px;white-space:nowrap}.account{width:32px;height:32px;border:1px solid #103e3830;border-radius:50%;display:grid;place-items:center}.account svg{width:15px;height:15px}.mock-hero{display:grid;grid-template-columns:.8fr 1.2fr;gap:35px;padding:25px 36px 27px;align-items:center}.mock-title{font-size:33px;letter-spacing:-.05em;line-height:1.05;font-weight:500}.mock-title em{font-family:Georgia,serif;font-weight:400;color:#c86a4a}.mock-copy small{display:block;font-size:8px;letter-spacing:.16em;margin-bottom:14px}.mock-copy p{font-size:10px;color:#748078;margin:15px 0 0}.photo{height:145px;border-radius:14px;background:linear-gradient(90deg,#103e380a,#103e380a),url('/vehicles/hero-bmw-scene.webp') center 57%/cover}.classic .navbar{border-bottom:1px solid #103e3818}.floating{padding-top:18px;background:#f1ede4}.floating .navbar{margin:0 24px;background:#fffefb;border:1px solid #103e3810;border-radius:55px;box-shadow:0 7px 25px #103e3808;padding:0 24px;height:73px}.floating .book{background:#c86a4a}.floating .active:after{height:5px;width:5px;left:50%;right:auto;border-radius:50%;bottom:-11px}.floating .links{gap:22px}.dark .navbar{background:#103e38;color:#faf7f1}.dark .navbar .logo{content:url('/brand/rewaq-logo-light.svg')}.dark .book{background:#e8d6ba;color:#103e38}.dark .account{border-color:#ffffff50}.dark .active:after{background:#e8d6ba}.dark .actions>span{color:#d7dfd6}.badge{font-size:9px;background:#103e38;color:#faf7f1;padding:6px 10px;border-radius:15px;margin-left:10px;font-weight:400}footer{font-size:10px;color:#748078;text-align:center;padding:0 0 20px}@media(max-width:900px){main{padding:20px}.links{gap:12px;font-size:10px}.navbar{gap:12px;padding:0 22px}.logo{width:130px}.actions{gap:8px}.actions>span{display:none}.book{gap:10px;padding:12px}.heading{align-items:flex-start;gap:15px}.heading>span{max-width:240px;text-align:right}.mock-hero{padding:25px 22px}.floating .navbar{margin:0 15px;padding:0 18px}.floating .links{gap:12px}}@media(max-width:700px){.menu{display:block!important;font-size:22px!important}.links{display:none}.actions>.account{display:none}.mock-hero{grid-template-columns:1fr;gap:18px}.mock-title{font-size:30px}.photo{height:160px}.heading{display:block}.heading>span{display:block;text-align:left;max-width:none;margin-top:7px}.navbar{padding:0 18px}.floating .navbar{padding:0 15px}.floating .logo{width:120px}.floating .book{font-size:10px}.badge{margin-left:5px}.screen{border-radius:15px}}</style></head><body><main><h1>Trois façons d’accueillir vos visiteurs.</h1><p class="intro">Même identité REWAQ. Moins de boutons. Une navigation plus claire.</p><div id="proposals"></div></main><footer>Propositions visuelles · La navbar actuelle reste en place jusqu’à votre choix.</footer><script>const user='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="8" r="3.5"/><path d="M5 21v-2a7 7 0 0 1 14 0v2"/></svg>';const options=[['classic','01 — Ligne claire','Conseillé','Logo à gauche · Menu au centre · Réserver à droite'],['floating','02 — Floating premium','','Barre arrondie · Fond ivoire · Bouton terracotta'],['dark','03 — Signature REWAQ','','Bande vert forêt · Logo clair · Bouton sable']];document.getElementById('proposals').innerHTML=options.map(([cls,title,badge,desc])=>`<section class="proposal"><div class="heading"><strong>${title}${badge?'<b class="badge">'+badge+'</b>':''}</strong><span>${desc}</span></div><div class="screen ${cls}"><header class="navbar"><img class="logo" src="/brand/rewaq-logo.svg" alt="REWAQ Location"><nav class="links"><a href="#" class="active">Accueil</a><a href="#">Nos voitures</a><a href="#">Nos services</a><a href="#">À propos</a><a href="#">Contact</a></nav><div class="actions"><span class="menu" aria-label="Menu">☰</span><span>MAD · DH</span><div class="account" title="Administration">${user}</div><a class="book" href="#">Réserver une voiture <span>↗</span></a></div></header><div class="mock-hero"><div class="mock-copy"><small>MARRAKECH, YOUR WAY.</small><div class="mock-title">Your journey.<br/>Your freedom.<br/><em>Your REWAQ.</em></div><p>Votre voiture. Votre liberté. Votre arrivée.</p></div><div class="photo"></div></div></div></section>`).join('');document.querySelectorAll('a').forEach(a=>a.addEventListener('click',e=>e.preventDefault()));</script></body></html>
