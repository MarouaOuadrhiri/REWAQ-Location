<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>REWAQ — Compare design concepts</title><style>*{box-sizing:border-box}body{margin:0;background:#faf7f1;color:#103e38;font-family:Arial,sans-serif}a{text-decoration:none;color:inherit}button,input{font:inherit}button{cursor:pointer}.wrap{max-width:1360px;margin:auto;padding:0 42px}.header{height:88px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #103e3815}.header img{width:165px;height:50px;object-fit:contain}.header nav{display:flex;gap:25px;align-items:center;font-size:11px}.pill{display:inline-flex;gap:23px;align-items:center;padding:13px 19px;border-radius:28px;background:#103e38;color:#faf7f1;font-size:11px;border:0}.outline{background:transparent;color:#103e38;border:1px solid #cdd6c9}.intro{display:flex;justify-content:space-between;align-items:end;margin:33px 0 27px;gap:30px}.eyebrow{font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:#b16045}h1{font-size:43px;line-height:1.05;letter-spacing:-.05em;font-weight:500;margin:13px 0 0}.intro p{font-size:12px;color:#708074;line-height:1.8;margin:0;max-width:250px}.toolbar{display:flex;align-items:center;justify-content:space-between;gap:15px;margin:20px 0}.selected{display:flex;gap:9px;flex-wrap:wrap}.chip{display:flex;gap:18px;align-items:center;border:1px solid #d9dfd4;border-radius:22px;font-size:10px;padding:10px 14px;background:#fffdf9}.chip.add{border-style:dashed;color:#7d8a7e}.toggle{display:flex;align-items:center;gap:8px;font-size:10px;white-space:nowrap}.toggle input{accent-color:#103e38}.sheet{border:1px solid #d9dfd4;border-radius:20px;overflow:hidden;background:#fffdf9}.compare-row{display:grid;grid-template-columns:180px repeat(3,1fr);border-bottom:1px solid #e8eadf}.compare-row:last-child{border:0}.compare-row>div{padding:17px 23px;border-left:1px solid #e8eadf;font-size:12px}.compare-row>div:first-child{border:0;font-size:10px;color:#7a867a;display:flex;align-items:center}.photo-head>div{padding-top:18px;padding-bottom:23px}.photo-head .image{height:155px;border-radius:13px;background:#eee9dd;overflow:hidden;margin-bottom:18px}.image img{width:100%;height:100%;object-fit:cover}.photo-head h2{font-size:21px;font-weight:500;letter-spacing:-.035em;margin:8px 0}.photo-head small{font-size:9px;color:#7a867a}.model-note{font-size:9px;color:#b16045;text-transform:uppercase;letter-spacing:.09em}.photo-head>div:first-child{display:flex;flex-direction:column;align-items:flex-start;justify-content:center;font-size:24px;line-height:1.15;letter-spacing:-.04em;color:#103e38}.photo-head>div:first-child span{font-size:10px;color:#7a867a;letter-spacing:0;line-height:1.7;margin-top:14px}.price strong{font-size:24px;letter-spacing:-.045em;font-weight:500}.price small{font-size:10px;color:#7a867a}.note{display:flex;justify-content:space-between;gap:20px;font-size:10px;color:#7a867a;padding:20px 0 30px;line-height:1.7}.footer{border-top:1px solid #103e3818;padding:20px 0;font-size:9px;color:#7a867a;display:flex;justify-content:space-between}.option{display:none}.option.visible{display:block}
/* 2 — three photo cards */
.card-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}.compare-card{border:1px solid #d9dfd4;border-radius:20px;background:#fffdf9;overflow:hidden}.card-photo{height:250px;position:relative;overflow:hidden}.card-photo img{height:100%;width:100%;object-fit:cover;object-position:center 60%}.card-photo .tag{position:absolute;top:16px;left:16px;padding:8px 11px;border-radius:16px;background:#faf7f1df;font-size:9px}.card-body{padding:23px}.card-body h2{font-size:25px;font-weight:500;letter-spacing:-.04em;margin:7px 0 18px}.card-body .brand{font-size:9px;letter-spacing:.1em;color:#7a867a}.card-specs{display:grid;grid-template-columns:1fr 1fr;gap:13px;padding-bottom:22px;border-bottom:1px solid #e1e5da}.card-specs div{font-size:11px}.card-specs small{display:block;font-size:9px;color:#7a867a;margin-bottom:6px}.card-bottom{display:flex;align-items:center;justify-content:space-between;margin:22px 0}.card-bottom .price strong{font-size:27px}.card-body .pill{width:100%;justify-content:space-between}.quick-strip{display:flex;gap:30px;justify-content:space-between;align-items:center;padding:22px 25px;background:#e8d6ba;border-radius:17px;margin:23px 0}.quick-strip strong{font-size:18px;font-weight:500;letter-spacing:-.03em}.quick-strip p{font-size:10px;color:#708074;margin:8px 0 0}.quick-strip>span{font-size:11px}.date-fields{display:flex;gap:10px}.date-field{padding:11px 16px;background:#faf7f1;border-radius:11px;min-width:145px;font-size:11px}.date-field small{display:block;font-size:8px;color:#7a867a;margin-bottom:6px}
/* 3 — a focused choice */
.focus-layout{display:grid;grid-template-columns:.85fr 1.15fr;gap:24px}.focus-photo{height:445px;position:relative;isolation:isolate;overflow:hidden;border-radius:22px;color:#faf7f1}.focus-photo>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:-2}.focus-photo:after{content:'';position:absolute;inset:0;background:linear-gradient(0deg,#103e38ed,transparent 80%);z-index:-1}.focus-copy{position:absolute;bottom:28px;left:28px;right:28px}.focus-copy>span{font-size:9px;letter-spacing:.15em}.focus-copy h2{font-size:34px;letter-spacing:-.045em;font-weight:500;margin:13px 0}.focus-copy p{font-size:11px;color:#dce3d5;line-height:1.7}.focus-copy .pill{margin-top:12px;background:#faf7f1;color:#103e38}.focus-options{display:flex;gap:9px;margin-top:13px}.focus-option{background:#fffdf9;border:1px solid #d9dfd4;border-radius:12px;flex:1;padding:10px;color:#103e38;text-align:left}.focus-option[aria-pressed=true]{border-color:#c86a4a;box-shadow:inset 0 0 0 1px #c86a4a}.focus-option img{width:100%;height:65px;object-fit:contain}.focus-option strong{font-size:10px;display:block;margin-top:5px}.focus-options .image{height:65px;border-radius:7px;overflow:hidden}.focus-options .image img{object-fit:cover}.focus-table{border:1px solid #d9dfd4;border-radius:20px;background:#fffdf9;padding:25px}.focus-table h3{font-size:20px;font-weight:500;letter-spacing:-.03em;margin:0 0 18px}.focus-table .compare-row{grid-template-columns:105px repeat(3,1fr)}.focus-table .compare-row>div{padding:18px 10px;font-size:11px;text-align:center}.focus-table .compare-row>div:first-child{text-align:left}.focus-table .compare-row.head>div{font-size:10px;font-weight:600;background:#f3f3eb}.focus-foot{padding:20px 0 0;font-size:10px;color:#7a867a;line-height:1.8}.focus-table .price strong{font-size:20px}.focus-title-line{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.focus-title-line span{font-size:9px;color:#b16045;border:1px solid #c86a4a55;padding:7px 11px;border-radius:20px}.mobile-note{display:none}@media(max-width:850px){.wrap{padding:0 20px}.header nav a:not(.pill){display:none}.intro{display:block}.intro p{margin-top:18px;max-width:none}.card-grid,.focus-layout{grid-template-columns:1fr}.toolbar{align-items:flex-start}.compare-row{grid-template-columns:100px repeat(3,minmax(180px,1fr))}.sheet{overflow-x:auto}.focus-table{padding:15px;overflow-x:auto}.focus-table .compare-row{grid-template-columns:90px repeat(3,minmax(95px,1fr))}.photo-head .image{height:120px}.quick-strip{align-items:flex-start;flex-direction:column}.date-fields{flex-wrap:wrap}.note{display:block}.note span{display:block;margin-top:10px}.photo-head>div:first-child{font-size:18px}.header img{width:140px}.card-photo{height:270px}.focus-photo{height:420px}.footer{gap:20px;font-size:8px}.mobile-note{display:block;color:#7a867a;font-size:9px;margin:12px 0}}
</style></head><body><div class="wrap"><header class="header"><img src="/brand/rewaq-logo.svg" alt="REWAQ Location"><nav><a href="#">Nos voitures</a><a href="#" style="color:#c86a4a">Comparer</a><a href="#">Nos services</a><a href="#">À propos</a><a class="pill" href="#">Choisir mes dates ↗</a></nav></header><main id="content"></main><footer class="footer"><span>REWAQ LOCATION · MARRAKECH</span><span>Concept de comparaison · Photos illustratives générées · Prix de démonstration</span></footer></div><script>
const cars=[{model:'C-Class',brand:'MERCEDES-BENZ',category:'Executive',seats:'5 places',fuel:'Diesel',day:'500 DH',week:'3 000 DH',photo:'/vehicles/hero-mercedes-scene.webp'},{model:'M2',brand:'BMW',category:'Sport',seats:'4 places',fuel:'Essence',day:'850 DH',week:'5 100 DH',photo:'/vehicles/hero-bmw-scene.webp'},{model:'Boxster',brand:'PORSCHE',category:'Roadster',seats:'2 places',fuel:'Essence',day:'1 600 DH',week:'9 800 DH',photo:'/vehicles/hero-porsche-scene.webp'}];
const n=new URLSearchParams(location.search).get('option')||'1';const intro=(label,title,text)=>`<div class="intro"><div><span class="eyebrow">${label}</span><h1>${title}</h1></div><p>${text}</p></div>`;const toolbar=()=>`<div class="toolbar"><div class="selected">${cars.map(c=>`<span class="chip">${c.brand==='MERCEDES-BENZ'?'Mercedes':c.brand} ${c.model} <span>×</span></span>`).join('')}<span class="chip add">Modifier la sélection ＋</span></div><label class="toggle"><input type="checkbox" id="diff">Uniquement les différences</label></div>`;const row=(label,values,extra='')=>`<div class="compare-row ${extra}"><div>${label}</div>${values.map(v=>`<div>${v}</div>`).join('')}</div>`;const rows=()=>row('Catégorie',cars.map(c=>c.category))+row('Places',cars.map(c=>c.seats))+row('Transmission',['Automatique','Automatique','Automatique'],'same')+row('Carburant',cars.map(c=>c.fuel))+row('Tarif / jour',cars.map(c=>`<span class="price"><strong>${c.day}</strong><small> / jour</small></span>`));let html='';
if(n==='1'){html=intro('01 — Comparaison claire','Le bon choix,<br/>en un coup d’œil.','Trois voitures, les mêmes critères.<br/>À vous de choisir votre prochain trajet.')+toolbar()+`<div class="mobile-note">Faites défiler le tableau pour comparer les trois voitures.</div><div class="sheet"><div class="compare-row photo-head"><div>Votre prochaine<br/>voiture ?<span>Comparez l’essentiel.<br/>Vérifiez ensuite vos dates.</span></div>${cars.map(c=>`<div><div class="image"><img src="${c.photo}" alt="${c.brand} ${c.model}"></div><span class="model-note">${c.category}</span><h2>${c.model}</h2><small>${c.brand}</small></div>`).join('')}</div>${rows()}${row('Prochaine étape',cars.map(c=>`<a class="pill" href="#">Voir ${c.model} ↗</a>`))}</div><div class="note"><span>Les tarifs sont affichés avant les remises de durée.<br/>Le devis final dépend de vos dates et des services choisis.</span><span>Marrakech Menara · Retrait en ville</span></div>`;}
else if(n==='2'){html=intro('02 — Choix en images','Trois caractères.<br/>Votre prochain coup de cœur.','Découvrez les voitures en images.<br/>Gardez les critères essentiels sous les yeux.')+`<div class="toolbar"><div class="selected"><span class="chip">3 voitures sélectionnées</span><span class="chip add">Modifier la sélection ＋</span></div><span class="toggle">Marrakech · MAD / DH</span></div><div class="card-grid">${cars.map(c=>`<article class="compare-card"><div class="card-photo"><img src="${c.photo}" alt="${c.brand} ${c.model}"><span class="tag">${c.category}</span></div><div class="card-body"><span class="brand">${c.brand}</span><h2>${c.model}</h2><div class="card-specs"><div><small>Places</small>${c.seats}</div><div><small>Transmission</small>Automatique</div><div><small>Carburant</small>${c.fuel}</div><div><small>Catégorie</small>${c.category}</div></div><div class="card-bottom"><span class="price"><strong>${c.day}</strong><small> / jour</small></span></div><a class="pill" href="#">Découvrir ${c.model} ↗</a></div></article>`).join('')}</div><div class="quick-strip"><div><strong>Un choix en tête ? Vérifions vos dates.</strong><p>La disponibilité et le total sont confirmés dans votre devis.</p></div><div class="date-fields"><span class="date-field"><small>Départ</small>Choisir une date</span><span class="date-field"><small>Retour</small>Choisir une date</span></div></div>`;}
else {html=intro('03 — Focus & différences','Votre choix,<br/>sans hésitation.','Explorez une voiture en détail.<br/>Comparez les différences juste à côté.')+`<div class="focus-layout"><div><div class="focus-photo"><img id="focus-img" src="${cars[0].photo}" alt="Mercedes C-Class"><div class="focus-copy"><span id="focus-category">EXECUTIVE</span><h2 id="focus-model">Mercedes C-Class</h2><p id="focus-spec">5 places · Automatique · Diesel</p><a class="pill" href="#">Voir cette voiture ↗</a></div></div><div class="focus-options">${cars.map((c,i)=>`<button class="focus-option" data-index="${i}" aria-pressed="${i===0}"><div class="image"><img src="${c.photo}" alt=""></div><strong>${c.model}</strong></button>`).join('')}</div></div><div class="focus-table"><div class="focus-title-line"><h3>Ce qui fait la différence.</h3><span>3 voitures</span></div>${row('Votre sélection',cars.map(c=>c.model),'head')}${rows()}<div class="focus-foot">Un devis précis après le choix de vos dates.<br/>Livraison aéroport ou retrait à Marrakech, à organiser avec notre équipe.</div><a class="pill outline" href="#" style="margin-top:20px">Modifier ma sélection ＋</a></div></div><div class="quick-strip"><strong>Comparez. Choisissez. Prenez la route.</strong><span>Les détails du séjour déterminent le devis final.</span></div>`;}
document.getElementById('content').innerHTML=html;document.querySelectorAll('a').forEach(a=>a.addEventListener('click',e=>e.preventDefault()));document.getElementById('diff')?.addEventListener('change',e=>document.querySelectorAll('.same').forEach(el=>el.style.display=e.target.checked?'none':''));document.querySelectorAll('.focus-option').forEach(b=>b.addEventListener('click',()=>{const c=cars[+b.dataset.index];document.querySelectorAll('.focus-option').forEach(el=>el.setAttribute('aria-pressed',String(el===b)));document.getElementById('focus-img').src=c.photo;document.getElementById('focus-img').alt=c.brand+' '+c.model;document.getElementById('focus-model').textContent=c.brand+' '+c.model;document.getElementById('focus-category').textContent=c.category;document.getElementById('focus-spec').textContent=c.seats+' · Automatique · '+c.fuel;}));
</script></body></html>
